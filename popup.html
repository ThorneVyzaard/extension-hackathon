<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeLens Popup</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      width: 380px;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo i {
      font-size: 24px;
      color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
      padding: 8px;
      border-radius: 12px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .badge-hackathon {
      font-size: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      padding: 4px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }

    .scan-section {
      text-align: center;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.6);
    }

    .result-box {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      text-align: left;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .verdict-tag {
      font-weight: 700;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .verdict-real { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .verdict-fake { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .verdict-uncertain { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

    .score-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .score-fill {
      height: 100%;
      width: 0%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .history-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <i class="fa-solid fa-shield-halved"></i>
      <div>
        <h1>FakeLens</h1>
      </div>
    </div>
    <span class="badge-hackathon">ByteForge v2</span>
  </div>

  <div class="card scan-section">
    <button class="btn" id="scan-page-btn">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Analyser les images de la page
    </button>
    
    <div id="result-container" class="result-box">
      <div class="result-header">
        <span id="res-title" style="font-size: 12px; font-weight: 600;">Dernière analyse</span>
        <span id="res-verdict" class="verdict-tag verdict-fake">Généré (94%)</span>
      </div>
      <div style="font-size: 11px; color: var(--text-muted);" id="res-details">Modèle ONNX Local (Int8)</div>
      <div class="score-bar">
        <div id="res-bar-fill" class="score-fill" style="width: 94%; background: var(--danger);"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="history-title">
      <span>Historique de session</span>
      <i class="fa-solid fa-clock-rotate-left"></i>
    </div>
    <div class="history-list" id="history-container">
      <div style="text-align: center; color: var(--text-muted); font-size: 11px; padding: 10px;">Aucune image analysée</div>
    </div>
  </div>

  <div class="footer">
    ByteForge Hackathon • Mode Local-First & Confidentialité garantie
  </div>

  <script src="popup.js"></script>
</body>
</html>
